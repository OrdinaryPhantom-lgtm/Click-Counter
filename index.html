<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="info">
      <h2>Simple Counter</h2>
      <p>Keep track of anything with one tap. Use the buttons on the right to change the number.</p>
      <ul class="steps">
        <li>Press <b>+</b> to add one</li>
        <li>Press <b>-</b> to subtract one</li>
        <li>Press <b>Reset</b> to go back to zero</li>
      </ul>
    </div>

    <div class="counter">
      <h1 id="count">0</h1>
      <div class="buttons">
        <button id="plus">+</button>
        <button id="minus">-</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
